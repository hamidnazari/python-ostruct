name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require vMAJOR.MINOR.PATCH
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH, got $RELEASE_TAG"
            exit 1
          fi

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-tag
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

  package:
    name: Build and attest package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution inventory
        run: |
          wheel_count="$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)"
          sdist_count="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)"

          test "$wheel_count" -eq 1 || {
            echo "::error::Expected one wheel, found $wheel_count"
            exit 1
          }

          test "$sdist_count" -eq 1 || {
            echo "::error::Expected one source distribution, found $sdist_count"
            exit 1
          }

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          wheel_file="$(basename "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          package_version="$(printf '%s' "$wheel_file" | cut -d- -f2)"
          if [[ "${RELEASE_TAG#v}" != "$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel build from unpacked sdist
        run: |
          sdist_file="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          tmpdir="$(mktemp -d)"
          tar -xzf "$sdist_file" -C "$tmpdir"
          unpacked_dir="$(find "$tmpdir" -maxdepth 1 -mindepth 1 -type d)"
          python -m build --wheel "$unpacked_dir" --outdir "$tmpdir/dist"
          sdist_wheel="$(basename "$(find "$tmpdir/dist" -maxdepth 1 -name '*.whl' -print -quit)")"
          git_wheel="$(basename "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          if [[ "$sdist_wheel" != "$git_wheel" ]]; then
            echo "::error::Wheel version built from sdist ($sdist_wheel) does not match git wheel ($git_wheel)"
            exit 1
          fi

      - name: Install and smoke test wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c "from ostruct import OpenStruct; assert OpenStruct(a={'b': 1}, dict_convert=True).a.b == 1"

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package
    environment:
      name: pypi
      url: https://pypi.org/project/ostruct/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package
      - publish-pypi
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "ostruct $RELEASE_TAG"
