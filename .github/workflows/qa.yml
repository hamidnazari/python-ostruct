name: Quality Assurance

on:
  push:
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.8.18
          - 3.9.19
          - 3.10.14
          - 3.11.9
          - 3.12.4
          - pypy3.8
          - pypy3.9
          - pypy3.10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test cases
        run: make test
        env:
          TOXENV: py

      - name: Generate coverage report
        run: make codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false

  package:
    name: Build and validate package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: python -m pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Store package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  verify-package:
    name: Verify installed wheel
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel without source checkout
        run: python -m pip install dist/*.whl

      - name: Smoke test installed package
        run: >-
          python -c "from ostruct import OpenStruct;
          o = OpenStruct(owner={'name': 'Ada'}, dict_convert=True);
          assert o.owner.name == 'Ada'"
