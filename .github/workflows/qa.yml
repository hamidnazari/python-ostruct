name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Run Ruff
        run: python -m ruff check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest --junitxml="junit-${{ matrix.python-version }}.xml"

      - name: Store test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-${{ matrix.python-version }}
          path: junit-${{ matrix.python-version }}.xml
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[test]"

      - name: Run coverage
        run: >-
          python -m pytest
          --cov=ostruct
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Add coverage to job summary
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Store coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - test
      - coverage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify-package:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel without source checkout
        run: python -m pip install --no-deps dist/*.whl

      - name: Smoke test installed wheel
        run: >-
          python -c
          "from ostruct import OpenStruct;
          assert OpenStruct(owner={'name': 'Ada'}, dict_convert=True).owner.name == 'Ada'"
