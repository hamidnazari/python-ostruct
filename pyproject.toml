[build-system]
requires = [
    "hatchling>=1.27,<2",
    "hatch-vcs>=0.4,<1",
]
build-backend = "hatchling.build"

[project]
name = "ostruct"
dynamic = ["version"]
description = "OpenStruct data structure for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hamid Nazari", email = "hn@linux.com" },
]
keywords = [
    "data structure",
    "openstruct",
    "ostruct",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
]
dev = [
    "build>=1.2,<2",
    "ruff>=0.9,<1",
    "tox>=4.24,<5",
    "twine>=6,<7",
]

[project.urls]
Changelog = "https://github.com/hamidnazari/python-ostruct/releases"
Issues = "https://github.com/hamidnazari/python-ostruct/issues"
Repository = "https://github.com/hamidnazari/python-ostruct"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/ostruct",
    "/pyproject.toml",
    "/tests",
    "/tox.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["ostruct"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
