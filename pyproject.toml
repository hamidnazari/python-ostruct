[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ostruct"
version = "4.0.1"
description = "OpenStruct, the flexible data structure."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Hamid Nazari", email = "hn@linux.com" }
]
keywords = ["ostruct", "openstruct", "data structure", "data structures"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hamidnazari/python-ostruct"
Repository = "https://github.com/hamidnazari/python-ostruct"

[tool.setuptools.packages.find]
where = ["."]
include = ["ostruct*"]

[tool.setuptools.package-data]
ostruct = ["py.typed"]
